[project]
name = "agent-server"
version = "0.1.0"
description = "Simple LangGraph agent exposed via FastAPI, consuming the secure remote calculator MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "langgraph>=0.4.0",
    "langchain>=0.3.25",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.7",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
]

[project.scripts]
agent-server = "agent_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_server"]
