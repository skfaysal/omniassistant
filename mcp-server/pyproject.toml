[project]
name = "mcp-server"
version = "0.1.0"
description = "Secure and scalable remote MCP server (calculator) with OAuth 2.1, gateway and observability patterns"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.4",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.scripts]
mcp-server = "mcp_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
